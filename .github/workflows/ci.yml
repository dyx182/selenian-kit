name: Build and tests run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@v4
      - name: Setup Java
      - uses: actions/checkout@v4
        with:
          java-version: 11
      - name: Run tests
        run: mvn test